server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/ld+json application/xml image/svg+xml;

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /about.html { return 301 /about; }
    location = /contact.html { return 301 /contact; }
    location = /privacy.html { return 301 /privacy; }
    location = /terms.html { return 301 /terms; }

    location = /about {
        alias /usr/share/nginx/html/about.html;
        sub_filter 'https://8kstream.net/about.html' 'https://8kstream.net/about';
        sub_filter_once on;
    }
    location = /contact {
        alias /usr/share/nginx/html/contact.html;
        sub_filter 'https://8kstream.net/contact.html' 'https://8kstream.net/contact';
        sub_filter_once on;
    }
    location = /privacy {
        alias /usr/share/nginx/html/privacy.html;
        sub_filter 'https://8kstream.net/privacy.html' 'https://8kstream.net/privacy';
        sub_filter_once on;
    }
    location = /terms {
        alias /usr/share/nginx/html/terms.html;
        sub_filter 'https://8kstream.net/terms.html' 'https://8kstream.net/terms';
        sub_filter_once on;
    }

    location ~ ^/(features|devices|subscriptions|reseller-panels|iptv-guide|server-directory|faq)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=300, s-maxage=3600, stale-while-revalidate=86400";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
