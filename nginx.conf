server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  sendfile on;
  etag on;
  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json application/ld+json application/xml image/svg+xml;
  error_page 404 /404.html;
  location = /404.html { internal; }
  location ~ ^/(features|devices|subscriptions|reseller-panels|iptv-guide|server-directory|faq)/?$ { try_files /index.html =404; add_header Cache-Control "public,max-age=300,s-maxage=3600"; }
  location = /about { alias /usr/share/nginx/html/about.html; }
  location = /contact { alias /usr/share/nginx/html/contact.html; }
  location = /privacy { alias /usr/share/nginx/html/privacy.html; }
  location = /terms { alias /usr/share/nginx/html/terms.html; }
  location = /about.html { return 301 /about; }
  location = /contact.html { return 301 /contact; }
  location = /privacy.html { return 301 /privacy; }
  location = /terms.html { return 301 /terms; }
  location / { try_files $uri $uri/ =404; }
  location ~* \.(?:css|js|webp|png|jpe?g|gif|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public,max-age=2592000,immutable"; try_files $uri =404; }
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(),microphone=(),geolocation=()" always;
}
