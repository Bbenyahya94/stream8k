<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0B0F17">
  <title>Page Not Found | 8KStream</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,rgba(139,92,246,.2),transparent 30%),radial-gradient(circle at 80% 80%,rgba(6,182,212,.16),transparent 32%),#0B0F17;color:#f8fafc;font-family:Inter,Arial,sans-serif}.card{width:min(620px,100%);padding:48px 30px;text-align:center;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(17,24,39,.72);box-shadow:0 30px 90px rgba(0,0,0,.4)}.code{font-size:clamp(72px,18vw,150px);font-weight:900;line-height:.9;background:linear-gradient(120deg,#8B5CF6,#06B6D4);-webkit-background-clip:text;color:transparent}.card h1{margin:24px 0 12px;font-size:30px}.card p{margin:0 auto 28px;max-width:440px;color:#94a3b8;line-height:1.7}.card a{display:inline-flex;min-height:50px;align-items:center;padding:0 24px;border-radius:14px;background:linear-gradient(120deg,#8B5CF6,#06B6D4);color:white;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you requested does not exist or may have moved. Return to 8KStream to compare subscriptions and reseller panels.</p>
    <a href="/">Return to homepage</a>
  </main>
</body>
</html>
